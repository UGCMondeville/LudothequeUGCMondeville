
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Ludothèque UGC Mondeville</title>

  <style>
    :root {
      --blue: #031788;
      --white: #ffffff;
      --ink: #172033;
      --muted: #65708a;
      --border: #e0e5ef;
      --accent: #f3c842;
      --button: #1237b5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--blue);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .site-header {
      width: 100%;
      padding: 36px 20px 28px;
      text-align: center;
      color: var(--white);
    }

    .site-header h1 {
      width: 100%;
      margin: 0 auto 12px;
      text-align: center;
      font-size: clamp(2.2rem, 5.5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -1.2px;
    }

    .site-header p {
      max-width: 650px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e1e7ff;
    }

    .header-decoration {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 18px;
    }

    .header-decoration span {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    .header-decoration span:nth-child(2) {
      background: #6ed8ff;
    }

    .header-decoration span:nth-child(3) {
      background: #ff91b8;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
      padding-bottom: 50px;
    }

    .intro-panel {
      margin: 0 0 24px;
      padding: 22px;
      border-radius: 18px;
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.13);
    }

    .intro-panel h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    .intro-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1 1 250px;
    }

    .search-box input,
    .category-filter {
      width: 100%;
      min-height: 48px;
      padding: 12px 15px;
      border: 1px solid #d8def0;
      border-radius: 12px;
      outline: none;
      background: var(--white);
      color: var(--ink);
    }

    .search-box input:focus,
    .category-filter:focus {
      border-color: #86a0ff;
      box-shadow: 0 0 0 3px rgba(170, 190, 255, 0.28);
    }

    .category-filter {
      flex: 0 1 220px;
      cursor: pointer;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 18px;
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.15);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 13px 28px rgba(0, 0, 0, 0.23);
    }

    .game-art {
      position: relative;
      display: flex;
      min-height: 175px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      background: #edf1ff;
    }

    .game-art svg {
      display: block;
      width: 100%;
      max-width: 230px;
      height: 145px;
    }

    .game-art .art-emoji {
      font-size: 5rem;
      line-height: 1;
      filter: drop-shadow(0 7px 4px rgba(0, 0, 0, 0.1));
    }

    .game-card-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 17px;
    }

    .category-tag {
      align-self: flex-start;
      margin-bottom: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eaf0ff;
      color: #1738a6;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.25px;
      text-transform: uppercase;
    }

    .game-card h3 {
      margin: 0 0 8px;
      font-size: 1.13rem;
      line-height: 1.35;
    }

    .game-card p {
      flex: 1;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.91rem;
      line-height: 1.5;
    }

    .primary-button,
    .secondary-button,
    .back-button {
      display: inline-flex;
      min-height: 43px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 15px;
      border: 0;
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    .primary-button {
      background: var(--button);
      color: var(--white);
    }

    .secondary-button {
      border: 1px solid #dce3f4;
      background: #f4f6fc;
      color: var(--ink);
    }

    .back-button {
      margin-bottom: 20px;
      background: var(--white);
      color: var(--blue);
    }

    .primary-button:hover,
    .secondary-button:hover,
    .back-button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .game-card .primary-button {
      width: 100%;
      margin-top: auto;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 45px 20px;
      border-radius: 18px;
      background: var(--white);
      color: var(--ink);
      text-align: center;
    }

    .empty-state h3 {
      margin-top: 0;
    }

    .empty-state p {
      color: var(--muted);
    }

    .detail-page {
      display: none;
    }

    .detail-panel {
      overflow: hidden;
      border-radius: 20px;
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .detail-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 28px;
      align-items: center;
      padding: 30px;
      background: #f0f3ff;
    }

    .detail-art {
      display: flex;
      min-height: 260px;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 16px;
      background: var(--white);
    }

    .detail-art svg {
      display: block;
      width: 100%;
      max-width: 340px;
      height: 230px;
    }

    .detail-art .art-emoji {
      font-size: 7rem;
    }

    .detail-copy h2 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.15;
    }

    .detail-copy > p {
      color: #536078;
      line-height: 1.7;
    }

    .detail-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
    }

    .meta-item {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
    }

    .meta-item .meta-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meta-item strong {
      font-size: 1rem;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .detail-body {
      padding: 28px 30px 32px;
    }

    .detail-body h3 {
      margin: 0 0 12px;
      font-size: 1.25rem;
    }

    .detail-body p {
      color: #536078;
      line-height: 1.7;
    }

    .detail-body ul {
      padding-left: 22px;
      color: #536078;
      line-height: 1.9;
    }

    .site-footer {
      padding: 20px 15px 30px;
      color: #dce4ff;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 1000px) {
      .games-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .site-header {
        padding: 30px 16px 23px;
      }

      .site-header h1 {
        letter-spacing: -0.6px;
      }

      main {
        width: min(100% - 24px, 560px);
      }

      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .game-art {
        min-height: 135px;
        padding: 12px;
      }

      .game-art svg {
        height: 115px;
      }

      .game-art .art-emoji {
        font-size: 3.8rem;
      }

      .game-card-content {
        padding: 13px;
      }

      .game-card h3 {
        font-size: 1rem;
      }

      .game-card p {
        font-size: 0.85rem;
      }

      .detail-hero {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .detail-art {
        min-height: 210px;
      }

      .detail-art svg {
        height: 185px;
      }

      .detail-body {
        padding: 22px 18px;
      }

      .detail-meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .intro-panel {
        padding: 18px;
      }
    }

    @media (max-width: 390px) {
      .games-grid {
        grid-template-columns: 1fr;
      }

      .game-art {
        min-height: 165px;
      }

      .game-art svg {
        height: 135px;
      }

      .game-card-content {
        padding: 17px;
      }

      .detail-meta {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>

              <rect x="8" y="5" width="75" height="115" rx="12" fill="#1778dd" stroke="#ffffff" stroke-width="4"/>
              <ellipse cx="45" cy="62" rx="27" ry="39" fill="#ffffff" transform="rotate(-25 45 62)"/>
              <text x="45" y="75" font-size="31" font-weight="900" text-anchor="middle" fill="#1778dd">O</text>
            </g>
          </svg>
        `;
      }

      const emojiSize = detail ? "7rem" : "5rem";
      return `<div class="art-emoji" style="font-size:${emojiSize}" aria-hidden="true">${escapeHtml(game.emoji)}</div>`;
    }

    function renderGames() {
      const searchTerm = searchInput.value.trim().toLocaleLowerCase("fr");
      const selectedCategory = categoryFilter.value;

      const filteredGames = games.filter(game => {
        const matchesSearch =
          game.name.toLocaleLowerCase("fr").includes(searchTerm) ||
          game.description.toLocaleLowerCase("fr").includes(searchTerm) ||
          game.category.toLocaleLowerCase("fr").includes(searchTerm);

        const matchesCategory =
          selectedCategory === "all" || game.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      if (filteredGames.length === 0) {
        gamesGrid.innerHTML = `
          <div class="empty-state">
            <h3>Aucun jeu trouvé</h3>
            <p>Essaie un autre nom ou une autre catégorie.</p>
          </div>
        `;
        return;
      }

      gamesGrid.innerHTML = filteredGames.map(game => `
        <article class="game-card">
          <div class="game-art" style="background:${game.color}">
            ${renderGameArt(game)}
          </div>
          <div class="game-card-content">
            <span class="category-tag">${escapeHtml(game.category)}</span>
            <h3>${escapeHtml(game.name)}</h3>
            <p>${escapeHtml(game.description)}</p>
            <button
              class="primary-button"
              type="button"
              data-game-id="${escapeHtml(game.id)}"
            >
              Découvrir le jeu →
            </button>
          </div>
        </article>
      `).join("");

      gamesGrid.querySelectorAll("[data-game-id]").forEach(button => {
        button.addEventListener("click", () => {
          openGame(button.dataset.gameId);
        });
      });
    }

    function openGame(gameId) {
      const game = games.find(item => item.id === gameId);
      if (!game) return;

      homePage.style.display = "none";
      detailPage.style.display = "block";

      const retailerButton = game.productUrl
        ? `<a class="primary-button" href="${escapeHtml(game.productUrl)}" target="_blank" rel="noopener noreferrer">Voir le jeu en ligne ↗</a>`
        : "";

      detailContent.innerHTML = `
        <article class="detail-panel">
          <div class="detail-hero">
            <div class="detail-art" style="background:${game.color}">
              ${renderGameArt(game, true)}
            </div>

            <div class="detail-copy">
              <span class="category-tag">${escapeHtml(game.category)}</span>
              <h2>${escapeHtml(game.name)}</h2>
              <p>${escapeHtml(game.description)}</p>

              <div class="detail-meta">
                <div class="meta-item">
                  <span class="meta-label">Joueurs</span>
                  <strong>${escapeHtml(game.players)}</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Durée</span>
                  <strong>${escapeHtml(game.duration)}</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Âge conseillé</span>
                  <strong>${escapeHtml(game.age)}</strong>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Catégorie</span>
                  <strong>${escapeHtml(game.category)}</strong>
                </div>
              </div>

              <div class="detail-actions">
                ${retailerButton}
                <button id="detail-back-button" class="secondary-button" type="button">
                  ← Retour aux jeux
                </button>
              </div>
            </div>
          </div>

          <div class="detail-body">
            <h3>Comment jouer ?</h3>
            <p>${escapeHtml(game.rules)}</p>
          </div>
        </article>
      `;

      document.getElementById("detail-back-button").addEventListener("click", showHome);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showHome() {
      detailPage.style.display = "none";
      homePage.style.display = "block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    searchInput.addEventListener("input", renderGames);
    categoryFilter.addEventListener("change", renderGames);
    backButton.addEventListener("click", showHome);

    renderGames();
  </script>
</body>
</html>

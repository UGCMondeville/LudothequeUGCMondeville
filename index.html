  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #202438;
      --muted: #73788b;
      --primary: #5546d7;
      --primary-dark: #4032b5;
      --border: #e6e8f0;
      --radius: 20px;
      --shadow: 0 8px 28px rgba(35, 39, 70, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .topbar-inner {
      width: min(1100px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--primary);
      color: white;
      font-size: 25px;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .count {
      background: #efedff;
      color: var(--primary-dark);
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 60px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: clamp(25px, 4vw, 36px);
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 13px 34px rgba(35, 39, 70, .14);
    }

    .game-card:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .game-art {
      display: block;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      background: #f0efff;
    }

    .game-content {
      padding: 17px;
    }

    .game-content h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .game-content p {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: #f1f2f8;
      border-radius: 999px;
      padding: 6px 9px;
      color: #555a70;
      font-size: 12px;
      font-weight: 650;
    }

    /* Bouton de retour, placé en dehors de la fiche */

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 15px 22px;
      background: #fff;
      color: var(--primary-dark);
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 4px 14px rgba(35, 39, 70, .06);
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }

    .back-button:hover {
      background: #efedff;
      transform: translateX(-3px);
    }

    .back-button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    /* Fiche produit */

    .detail {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .detail-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .detail-art {
      width: 100%;
      height: 100%;
      min-height: 300px;
      display: block;
      background: #f0efff;
    }

    .detail-info {
      padding: clamp(22px, 4vw, 38px);
    }

    .detail-info h2 {
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.12;
      margin: 0 0 14px;
    }

    .detail-description {
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 22px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      padding: 13px 18px;
      text-decoration: none;
      font-weight: 750;
      border: 1px solid var(--border);
      cursor: pointer;
      background: white;
      color: var(--text);
      transition: background .18s ease;
    }

    .button-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    /* Section Comment jouer */

    .rules-section {
      border-top: 1px solid var(--border);
      padding: clamp(22px, 4vw, 32px);
      background: #fff;
    }

    .rules-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .rules-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 13px;
      background: #efedff;
      font-size: 23px;
    }

    .rules-heading h3 {
      margin: 0;
      font-size: 23px;
    }

    .rules-intro {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.65;
    }

    .rules-steps {
      display: grid;
      gap: 12px;
    }

    .rule-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px;
      background: #f8f8fc;
      border: 1px solid #ececf5;
      border-radius: 15px;
    }

    .rule-number {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-weight: 850;
      font-size: 15px;
    }

    .rule-step p {
      margin: 2px 0 0;
      color: #51566b;
      line-height: 1.65;
    }

    .rules-tip {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 14px;
      background: #fff7e4;
      color: #735522;
      line-height: 1.6;
      font-size: 14px;
    }

    .rules-tip strong {
      display: block;
      margin-bottom: 4px;
    }

    .info-section {
      border-top: 1px solid var(--border);
      padding: clamp(22px, 4vw, 32px);
    }

    .info-section h3 {
      margin: 0 0 15px;
      font-size: 21px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .info-item {
      background: #f8f8fc;
      border: 1px solid #ececf5;
      border-radius: 13px;
      padding: 14px;
    }

    .info-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 750;
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #c9cadd;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 25px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-top {
        grid-template-columns: 1fr;
      }

      .detail-art {
        min-height: 0;
      }
    }

    @media (max-width: 540px) {
      .topbar-inner {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
      }

      .count {
        font-size: 11px;
        padding: 8px 10px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .game-art {
        aspect-ratio: 1.65 / 1;
      }

      .back-button {
        width: 100%;
        justify-content: flex-start;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .rules-heading h3 {
        font-size: 21px;
      }
    }
  </style>
</head>

        connect: `
          <rect x="82" y="60" width="154" height="170" rx="13" fill="#2768ca"/>
          ${Array.from({length: 6}, (_, r) =>
            Array.from({length: 7}, (_, c) =>
              `<circle cx="${99 + c * 21}" cy="${79 + r * 26}" r="7.5" fill="${(r + c) % 3 === 0 ? "#ffd54d" : (r + c) % 3 === 1 ? "#f4f6ff" : "#e94b55"}"/>`
            ).join("")

        evades: `

              <rect x="${78 + i * 28}" y="${88 + (i % 2) * 12}" width="48" height="104" rx="8" fill="${["#f16b65","#f4c94b","#63bd92","#4b91df","#9a77df"][i]}" stroke="#fff" stroke-width="3"/>
              <circle cx="${102 + i * 28}" cy="${135 + (i % 2) * 12}" r="14" fill="#fff" opacity=".9"/>

        flip: `
          <g transform="rotate(-10 115 145)">
            <rect x="72" y="76" width="90" height="137" rx="13" fill="#ffdb4e" stroke="#fff" stroke-width="4"/>

          <g transform="rotate(-10 115 143)">

      };

      const retailerBadge = game.retailer === "JouéClub"
        ? `
          <g transform="translate(18 18)">
            <rect width="112" height="40" rx="9" fill="#fff" stroke="#e4e7f0"/>
            <image href="https://cdn.worldvectorlogo.com/logos/logo-joueclub-2016-blue-.svg"
              x="9" y="5" width="94" height="30"
              preserveAspectRatio="xMidYMid meet"/>
          </g>`
        : `
          <g transform="translate(18 18)">
            <rect width="94" height="40" rx="9" fill="#fff" stroke="#e4e7f0"/>
            <text x="47" y="26" text-anchor="middle"
              font-size="18" font-weight="900" fill="#e24a31">Cultura</text>
          </g>`;

      return `
        <svg class="game-art" viewBox="0 0 320 260"
          xmlns="http://www.w3.org/2000/svg"
          role="img" aria-label="Illustration du jeu">
          <rect width="320" height="260" fill="${game.color}"/>
          <circle cx="280" cy="42" r="53" fill="#fff" opacity=".25"/>
          <circle cx="36" cy="233" r="54" fill="#fff" opacity=".25"/>
          <path d="M0 224 Q80 194 160 228 T320 215 V260 H0Z" fill="#fff" opacity=".28"/>
          ${retailerBadge}
          ${scenes[game.scene] || ""}
        </svg>`;
    }

    function renderCard(game) {
      return `
        <article class="game-card"
          tabindex="0"
          role="link"
          aria-label="Voir ${escapeHtml(game.name)}"
          onclick="openGame('${game.id}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGame('${game.id}')}">
          ${renderIllustration(game)}
          <div class="game-content">
            <h3>${escapeHtml(game.name)}</h3>
            <p>${escapeHtml(game.description)}</p>
            <div class="meta">
              <span class="tag">${escapeHtml(game.category)}</span>
              <span class="tag">${escapeHtml(game.players)}</span>
              <span class="tag">${escapeHtml(game.age)}</span>
            </div>
          </div>
        </article>`;
    }

    function renderCatalogue() {
      app.innerHTML = `
        <section class="intro">
          <h2>Découvrez nos jeux 🎲</h2>
          <p>Retrouvez les jeux de la ludothèque, consultez leurs règles et découvrez où les trouver.</p>
        </section>

        <section class="game-grid" id="game-grid" aria-label="Catalogue des jeux">
          ${games.map(renderCard).join("")}
        </section>`;
    }

    function openGame(id) {
      location.hash = `jeu/${id}`;
    }

    function renderRules(game) {
      return `
        <section class="rules-section">
          <div class="rules-heading">
            <div class="rules-icon" aria-hidden="true">📖</div>
            <h3>Comment jouer ?</h3>
          </div>

          <p class="rules-intro">
            Voici les principales étapes pour comprendre le déroulement de la partie.
          </p>

          <div class="rules-steps">
            ${game.rules.map((rule, index) => `
              <div class="rule-step">
                <div class="rule-number">${index + 1}</div>
                <p>${escapeHtml(rule)}</p>
              </div>
            `).join("")}
          </div>

          ${game.tip ? `
            <div class="rules-tip">
              <strong>💡 Notre conseil</strong>
              ${escapeHtml(game.tip)}
            </div>
          ` : ""}
        </section>`;
    }

    function renderDetail(id) {
      const game = games.find(item => item.id === id);

      if (!game) {
        location.hash = "catalogue";
        return;
      }

      app.innerHTML = `
        <button class="back-button" onclick="location.hash='catalogue'">
          <span aria-hidden="true">←</span>
          Retour à la ludothèque
        </button>

        <article class="detail">
          <div class="detail-top">
            <div>
              ${renderIllustration(game).replace(
                'class="game-art"',
                'class="detail-art"'
              )}
            </div>

            <div class="detail-info">
              <h2>${escapeHtml(game.name)}</h2>

              <p class="detail-description">
                ${escapeHtml(game.description)}
              </p>

              <div class="detail-meta">
                <span class="tag">${escapeHtml(game.category)}</span>
                <span class="tag">👥 ${escapeHtml(game.players)}</span>
                <span class="tag">🎂 ${escapeHtml(game.age)}</span>
                <span class="tag">⏱️ ${escapeHtml(game.duration)}</span>
              </div>

              <div class="actions">
                <a class="button button-primary"
                  href="${escapeHtml(game.productUrl)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  Voir chez ${escapeHtml(game.retailer)} ↗
                </a>
              </div>
            </div>
          </div>

          ${renderRules(game)}

          <section class="info-section">
            <h3>ℹ️ Informations sur le jeu</h3>

            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">Catégorie</span>
                <span class="info-value">${escapeHtml(game.category)}</span>
              </div>

              <div class="info-item">
                <span class="info-label">Nombre de joueurs</span>
                <span class="info-value">${escapeHtml(game.players)}</span>
              </div>

              <div class="info-item">
                <span class="info-label">Âge conseillé</span>
                <span class="info-value">${escapeHtml(game.age)}</span>
              </div>

              <div class="info-item">
                <span class="info-label">Durée indicative</span>
                <span class="info-value">${escapeHtml(game.duration)}</span>
              </div>

              <div class="info-item">
                <span class="info-label">Enseigne</span>
                <span class="info-value">${escapeHtml(game.retailer)}</span>
              </div>
            </div>
          </section>
        </article>`;
    }

    function renderApp() {
      const hash = decodeURIComponent(location.hash.slice(1));

      if (hash.startsWith("jeu/")) {
        renderDetail(hash.slice(4));
      } else {
        renderCatalogue();
      }

      window.scrollTo({ top: 0, behavior: "auto" });
    }

    window.openGame = openGame;

    window.addEventListener("hashchange", renderApp);

    if (!location.hash) {
      history.replaceState(null, "", "#catalogue");
    }

    renderApp();
  </script>
</body>
</html>

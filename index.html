
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Ludothèque UGC Mondeville</title>

<style>
:root {
  --fond: #031788;
  --texte: #ffffff;
  --carte: #ffffff;
  --texte-carte: #20243a;
  --accent: #f3c842;
  --bouton: #1739a8;
  --bordure: #e0e3ec;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fond);
  color: var(--texte);
}

header {
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0 auto 12px;
  text-align: center;
  font-size: clamp(2rem, 5vw, 3.4rem);
  line-height: 1.15;
  font-weight: 800;
}

header p {
  margin: 0 auto;
  color: #e2e7ff;
  font-size: 1rem;
  line-height: 1.5;
}

main {
  width: min(1200px, calc(100% - 32px));
  margin: 0 auto;
  padding-bottom: 40px;
}

.intro {
  padding: 20px;
  margin-bottom: 22px;
  border-radius: 12px;
  background: var(--carte);
  color: var(--texte-carte);
}

.intro h2 {
  margin: 0 0 8px;
}

.intro p {
  margin: 0;
  line-height: 1.6;
}

.filtres {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 22px;
}

.filtres input,
.filtres select {
  min-height: 44px;
  padding: 10px 13px;
  border: 1px solid var(--bordure);
  border-radius: 8px;
  background: #fff;
  color: #20243a;
  font: inherit;
}

.filtres input {
  flex: 1 1 240px;
}

.filtres select {
  flex: 0 1 220px;
}

.jeux {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.jeu {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--bordure);
  border-radius: 12px;
  background: var(--carte);
  color: var(--texte-carte);
}

.illustration {
  height: 165px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  font-size: 4.5rem;
  background: #edf0fa;
}

.illustration svg {
  max-width: 100%;
  height: 140px;
}

.contenu-jeu {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 16px;
}

.categorie {
  align-self: flex-start;
  display: inline-block;
  margin-bottom: 9px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e9edff;
  color: #1739a8;
  font-size: 0.75rem;
  font-weight: bold;
}

.jeu h3 {
  margin: 0 0 8px;
  font-size: 1.1rem;
}

.jeu p {
  flex: 1;
  margin: 0 0 15px;
  color: #60677b;
  font-size: 0.92rem;
  line-height: 1.5;
}

button,
.bouton {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  min-height: 42px;
  padding: 10px 14px;
  border: 0;
  border-radius: 8px;
  background: var(--bouton);
  color: #fff;
  font: inherit;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
}

button:hover,
.bouton:hover {
  filter: brightness(1.12);
}

.jeu button {
  width: 100%;
  margin-top: auto;
}

.page-detail {
  display: none;
}

.retour {
  margin-bottom: 18px;
  background: #fff;
  color: var(--fond);
}

.detail-carte {
  overflow: hidden;
  border-radius: 12px;
  background: #fff;
  color: var(--texte-carte);
}

.detail-haut {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: 25px;
  align-items: center;
  padding: 25px;
  background: #edf0fa;
}

.detail-illustration {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 240px;
  border-radius: 10px;
  background: #fff;
  font-size: 7rem;
}

.detail-illustration svg {
  max-width: 100%;
  height: 220px;
}

.detail-infos h2 {
  margin: 8px 0 12px;
  font-size: clamp(1.7rem, 4vw, 2.6rem);
}

.detail-infos p {
  line-height: 1.7;
  color: #505970;
}

.metadonnees {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 20px 0;
}

.meta {
  padding: 13px;
  border: 1px solid var(--bordure);
  border-radius: 8px;
  background: #fff;
}

.meta small {
  display: block;
  margin-bottom: 5px;
  color: #697188;
  text-transform: uppercase;
  font-size: 0.72rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

.bouton-secondaire {
  background: #edf0fa;
  color: #20243a;
}

.regles {
  padding: 25px;
}

.regles h3 {
  margin-top: 0;
}

.regles p {
  line-height: 1.7;
  color: #505970;
}

.vide {
  grid-column: 1 / -1;
  padding: 30px;
  border-radius: 12px;
  background: #fff;
  color: #20243a;
  text-align: center;
}

footer {
  padding: 22px 15px;
  color: #e2e7ff;
  text-align: center;
  font-size: 0.85rem;
}

@media (max-width: 1000px) {
  .jeux {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  header {
    padding: 24px 14px;
  }

  .jeux {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  main {
    width: calc(100% - 24px);
  }

  .illustration {
    height: 135px;
    font-size: 3.5rem;
  }

  .illustration svg {
    height: 115px;
  }

  .contenu-jeu {
    padding: 12px;
  }

  .jeu h3 {
    font-size: 1rem;
  }

  .detail-haut {
    grid-template-columns: 1fr;
    padding: 16px;
  }

  .detail-illustration {
    min-height: 190px;
  }

  .detail-illustration svg {
    height: 175px;
  }

  .regles {
    padding: 20px 16px;
  }
}

@media (max-width: 390px) {
  .jeux {
    grid-template-columns: 1fr;
  }

  .illustration {
    height: 160px;
  }

  .illustration svg {
    height: 140px;
  }

  .metadonnees {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>Ma Ludothèque UGC Mondeville</h1>
  <p>Découvrez les jeux disponibles et trouvez votre prochain jeu préféré !</p>
</header>

<main>

    </div>

    <div class="filtres">
      <input id="recherche" type="search" placeholder="Rechercher un jeu..." aria-label="Rechercher un jeu">
      <select id="filtre-categorie" aria-label="Filtrer par catégorie">
        <option value="Toutes">Toutes les catégories</option>
        <option value="Cartes">Cartes</option>
        <option value="Ambiance">Ambiance</option>
        <option value="Adresse">Adresse</option>
        <option value="Réflexion">Réflexion</option>
        <option value="Dés">Dés</option>

    </div>

    <div id="liste-jeux" class="jeux"></div>
  </section>

  <section id="page-detail" class="page-detail">
    <button id="retour" class="retour" type="button">← Retour à la ludothèque</button>
    <div id="detail"></div>
  </section>
</main>

<footer>Ma Ludothèque UGC Mondeville</footer>

const accueil = document.getElementById("accueil");
const pageDetail = document.getElementById("page-detail");
const listeJeux = document.getElementById("liste-jeux");
const detail = document.getElementById("detail");
const recherche = document.getElementById("recherche");
const filtreCategorie = document.getElementById("filtre-categorie");

function echapper(texte) {
  return String(texte).replace(/[&<>"']/g, caractere => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[caractere]);
}

function illustration(jeu, grande = false) {
  if (jeu.illustrationCartes) {
    return `
      <svg viewBox="0 0 260 170" role="img" aria-label="Deux cartes à jouer">
        <g transform="translate(48 16) rotate(-13 55 70)">
          <rect x="7" y="5" width="100" height="145" rx="9" fill="#fff" stroke="#d8dff0" stroke-width="2"/>
          <text x="20" y="31" font-size="22" font-weight="bold" fill="#d62f45">A</text>
          <text x="20" y="52" font-size="20" fill="#d62f45">♥</text>
          <text x="57" y="95" font-size="51" text-anchor="middle" fill="#d62f45">♥</text>
          <text x="92" y="134" font-size="22" font-weight="bold" text-anchor="end" fill="#d62f45">A</text>
        </g>
        <g transform="translate(111 15) rotate(12 55 70)">
          <rect x="7" y="5" width="100" height="145" rx="9" fill="#fff" stroke="#d8dff0" stroke-width="2"/>
          <text x="20" y="31" font-size="22" font-weight="bold" fill="#18244d">K</text>
          <text x="20" y="52" font-size="20" fill="#18244d">♠</text>
          <text x="57" y="95" font-size="51" text-anchor="middle" fill="#18244d">♠</text>
          <text x="92" y="134" font-size="22" font-weight="bold" text-anchor="end" fill="#18244d">K</text>

      <svg viewBox="0 0 260 170" role="img" aria-label="Cartes UNO colorées">
        <g transform="translate(35 20) rotate(-14 55 65)">
          <rect x="8" y="5" width="86" height="130" rx="13" fill="#ed2939" stroke="#fff" stroke-width="4"/>
          <ellipse cx="51" cy="70" rx="31" ry="45" fill="#fff" transform="rotate(-25 51 70)"/>
          <text x="51" y="83" font-size="35" font-weight="900" text-anchor="middle" fill="#ed2939">U</text>
        </g>
        <g transform="translate(90 10) rotate(8 55 65)">
          <rect x="8" y="5" width="86" height="130" rx="13" fill="#ffd43b" stroke="#fff" stroke-width="4"/>
          <ellipse cx="51" cy="70" rx="31" ry="45" fill="#fff" transform="rotate(-25 51 70)"/>
          <text x="51" y="83" font-size="35" font-weight="900" text-anchor="middle" fill="#172033">N</text>
        </g>
        <g transform="translate(145 22) rotate(17 45 60)">
          <rect x="8" y="5" width="75" height="115" rx="12" fill="#1778dd" stroke="#fff" stroke-width="4"/>
          <ellipse cx="45" cy="62" rx="27" ry="39" fill="#fff" transform="rotate(-25 45 62)"/>
          <text x="45" y="75" font-size="31" font-weight="900" text-anchor="middle" fill="#1778dd">O</text>
        </g>
      </svg>`;
  }

  return `<span aria-hidden="true">${echapper(jeu.emoji)}</span>`;
}

function afficherJeux() {
  const terme = recherche.value.trim().toLocaleLowerCase("fr");
  const categorie = filtreCategorie.value;

  const resultats = jeux.filter(jeu => {
    const correspondTexte =
      jeu.nom.toLocaleLowerCase("fr").includes(terme) ||
      jeu.description.toLocaleLowerCase("fr").includes(terme) ||
      jeu.categorie.toLocaleLowerCase("fr").includes(terme);

    const correspondCategorie =
      categorie === "Toutes" || jeu.categorie === categorie;

    return correspondTexte && correspondCategorie;
  });

  if (!resultats.length) {
    listeJeux.innerHTML = `
      <div class="vide">
        <h3>Aucun jeu trouvé</h3>
        <p>Essaie un autre nom ou une autre catégorie.</p>
      </div>`;
    return;
  }

  listeJeux.innerHTML = resultats.map(jeu => `
    <article class="jeu">
      <div class="illustration" style="background:${jeu.couleur}">
        ${illustration(jeu)}
      </div>
      <div class="contenu-jeu">
        <span class="categorie">${echapper(jeu.categorie)}</span>
        <h3>${echapper(jeu.nom)}</h3>
        <p>${echapper(jeu.description)}</p>
        <button type="button" data-id="${echapper(jeu.id)}">Découvrir le jeu →</button>
      </div>
    </article>
  `).join("");

  listeJeux.querySelectorAll("[data-id]").forEach(bouton => {
    bouton.addEventListener("click", () => ouvrirJeu(bouton.dataset.id));
  });
}

function ouvrirJeu(id) {
  const jeu = jeux.find(element => element.id === id);
  if (!jeu) return;

  accueil.style.display = "none";
  pageDetail.style.display = "block";

  const boutonProduit = jeu.lien
    ? `<a class="bouton" href="${echapper(jeu.lien)}" target="_blank" rel="noopener noreferrer">Voir le jeu en ligne ↗</a>`
    : "";

  detail.innerHTML = `
    <article class="detail-carte">
      <div class="detail-haut">
        <div class="detail-illustration" style="background:${jeu.couleur}">
          ${illustration(jeu, true)}
        </div>
        <div class="detail-infos">
          <span class="categorie">${echapper(jeu.categorie)}</span>
          <h2>${echapper(jeu.nom)}</h2>
          <p>${echapper(jeu.description)}</p>

          <div class="metadonnees">
            <div class="meta">
              <small>Joueurs</small>
              <strong>${echapper(jeu.joueurs)}</strong>
            </div>
            <div class="meta">
              <small>Durée</small>
              <strong>${echapper(jeu.duree)}</strong>
            </div>
            <div class="meta">
              <small>Âge conseillé</small>
              <strong>${echapper(jeu.age)}</strong>
            </div>
            <div class="meta">
              <small>Catégorie</small>
              <strong>${echapper(jeu.categorie)}</strong>
            </div>
          </div>

          <div class="actions">
            ${boutonProduit}
            <button class="bouton-secondaire" id="retour-detail" type="button">← Retour aux jeux</button>
          </div>
        </div>
      </div>

      <div class="regles">
        <h3>Comment jouer ?</h3>
        <p>${echapper(jeu.regles)}</p>
      </div>
    </article>
  `;

  document.getElementById("retour-detail").addEventListener("click", retourAccueil);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function retourAccueil() {
  pageDetail.style.display = "none";
  accueil.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("retour").addEventListener("click", retourAccueil);
recherche.addEventListener("input", afficherJeux);
filtreCategorie.addEventListener("change", afficherJeux);

afficherJeux();
</script>
</body>
</html>

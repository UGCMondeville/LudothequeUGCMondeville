<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma ludothèque à UGC Mondeville</title>

  <style>
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #202438;
      --muted: #73788b;
      --primary: #5546d7;
      --primary-dark: #4032b5;
      --border: #e6e8f0;
      --radius: 20px;
      --shadow: 0 8px 28px rgba(35, 39, 70, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .topbar-inner {
      width: min(1100px, 100%);
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--primary);
      color: white;
      font-size: 25px;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .count {
      background: #efedff;
      color: var(--primary-dark);
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 60px;
    }

    .intro {
      margin-bottom: 24px;
    }

    .intro h2 {
      margin: 0 0 8px;
      font-size: clamp(25px, 4vw, 36px);
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin: 22px 0;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 200px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
      outline: none;
    }

    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(85, 70, 215, .12);
    }

    .filter {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: white;
      color: var(--text);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 13px 34px rgba(35, 39, 70, .14);
    }

    .game-art {
      display: block;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      background: #f0efff;
    }

    .game-content {
      padding: 17px;
    }

    .game-content h3 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .game-content p {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      background: #f1f2f8;
      border-radius: 999px;
      padding: 6px 9px;
      color: #555a70;
      font-size: 12px;
      font-weight: 650;
    }

    .detail {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .detail-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .detail-art {
      width: 100%;
      height: 100%;
      min-height: 300px;
      display: block;
      background: #f0efff;
    }

    .detail-info {
      padding: clamp(22px, 4vw, 38px);
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 750;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .detail-info h2 {
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.12;
      margin: 0 0 14px;
    }

    .detail-description {
      color: var(--muted);
      line-height: 1.75;
      margin-bottom: 22px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .section {
      border-top: 1px solid var(--border);
      padding: 24px;
    }

    .section h3 {
      margin: 0 0 10px;
    }

    .section p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      padding: 12px 17px;
      text-decoration: none;
      font-weight: 750;
      border: 1px solid var(--border);
      cursor: pointer;
      background: white;
      color: var(--text);
    }

    .button-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #c9cadd;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 25px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .detail-top {
        grid-template-columns: 1fr;
      }

      .detail-art {
        min-height: 0;
      }
    }

    @media (max-width: 540px) {
      .topbar-inner {
        align-items: flex-start;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
      }

      .count {
        font-size: 11px;
        padding: 8px 10px;
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .game-art {
        aspect-ratio: 1.65 / 1;
      }
    }
  </style>
</head>

            <g transform="rotate(${(i - 2) * 9} ${105 + i * 28} 145)">
              <rect x="${78 + i * 28}" y="${88 + (i % 2) * 12}" width="48" height="104" rx="8" fill="${["#f16b65","#f4c94b","#63bd92","#4b91df","#9a77df"][i]}" stroke="#fff" stroke-width="3"/>
              <circle cx="${102 + i * 28}" cy="${135 + (i % 2) * 12}" r="14" fill="#fff" opacity=".9"/>
              <circle cx="${102 + i * 28}" cy="${135 + (i % 2) * 12}" r="5" fill="#34364d"/>
            </g>`).join("")}`,
        flip: `
          <g transform="rotate(-10 115 145)">
            <rect x="72" y="76" width="90" height="137" rx="13" fill="#ffdb4e" stroke="#fff" stroke-width="4"/>
            <text x="99" y="166" font-size="57" font-weight="1000" fill="#4c3bc1">7</text>
          </g>
          <g transform="rotate(11 192 145)">
            <rect x="154" y="66" width="90" height="137" rx="13" fill="#7258d9" stroke="#fff" stroke-width="4"/>
            <text x="181" y="153" font-size="57" font-weight="1000" fill="#fff">3</text>
          </g>
          <path d="M154 51 L165 34 L176 51 L165 47Z" fill="#e95b7b"/>`,
        roll: `
          <g transform="rotate(-10 115 143)">
            <rect x="75" y="89" width="85" height="85" rx="15" fill="#fff" stroke="#e17a45" stroke-width="4"/>
            <g fill="#e17a45">
              <circle cx="99" cy="113" r="7"/><circle cx="136" cy="150" r="7"/>
              <circle cx="136" cy="113" r="7"/><circle cx="99" cy="150" r="7"/>
            </g>
          </g>
          <g transform="rotate(10 200 150)">
            <rect x="164" y="105" width="73" height="73" rx="14" fill="#4c8fda" stroke="#fff" stroke-width="4"/>
            <g fill="#fff">
              <circle cx="183" cy="124" r="6"/><circle cx="218" cy="124" r="6"/>
              <circle cx="200" cy="142" r="6"/><circle cx="183" cy="160" r="6"/>
              <circle cx="218" cy="160" r="6"/>
            </g>
          </g>`
      };

      const retailerBadge = game.retailer === "JouéClub"
        ? `
          <g transform="translate(18 18)">
            <rect width="112" height="40" rx="9" fill="#fff" stroke="#e4e7f0"/>
            <image href="https://cdn.worldvectorlogo.com/logos/logo-joueclub-2016-blue-.svg"
              x="9" y="5" width="94" height="30"
              preserveAspectRatio="xMidYMid meet"/>
          </g>`
        : `
          <g transform="translate(18 18)">
            <rect width="94" height="40" rx="9" fill="#fff" stroke="#e4e7f0"/>
            <text x="47" y="26" text-anchor="middle"
              font-size="18" font-weight="900" fill="#e24a31">Cultura</text>
          </g>`;

      return `
        <svg class="game-art" viewBox="0 0 320 260"
          xmlns="http://www.w3.org/2000/svg"
          role="img" aria-label="Illustration du jeu"
          xmlns:xlink="http://www.w3.org/1999/xlink">
          <rect width="320" height="260" fill="${game.color}"/>
          <circle cx="280" cy="42" r="53" fill="#fff" opacity=".25"/>
          <circle cx="36" cy="233" r="54" fill="#fff" opacity=".25"/>
          <path d="M0 224 Q80 194 160 228 T320 215 V260 H0Z" fill="#fff" opacity=".28"/>
          ${retailerBadge}
          ${scenes[game.scene] || ""}
        </svg>`;
    }

    function renderCard(game) {
      return `
        <article class="game-card" tabindex="0" role="link"
          aria-label="Voir ${escapeHtml(game.name)}"
          onclick="openGame('${game.id}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGame('${game.id}')}">
          ${renderIllustration(game)}
          <div class="game-content">
            <h3>${escapeHtml(game.name)}</h3>
            <p>${escapeHtml(game.description)}</p>
            <div class="meta">
              <span class="tag">${escapeHtml(game.category)}</span>
              <span class="tag">${escapeHtml(game.players)}</span>
              <span class="tag">${escapeHtml(game.age)}</span>
            </div>
          </div>
        </article>`;
    }

    function renderCatalogue() {
      app.innerHTML = `
        <section class="intro">
          <h2>Découvrez nos jeux 🎲</h2>
          <p>Retrouvez les jeux de la ludothèque, consultez leurs règles et découvrez où les trouver.</p>
        </section>

        <div class="toolbar">
          <input class="search" id="search" type="search"
            placeholder="Rechercher un jeu…" aria-label="Rechercher un jeu">
          <select class="filter" id="category" aria-label="Filtrer par catégorie">
            <option value="">Toutes les catégories</option>
            ${[...new Set(games.map(game => game.category))]
              .sort()
              .map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`)
              .join("")}
          </select>
        </div>

        <section class="game-grid" id="game-grid" aria-label="Catalogue des jeux">
          ${games.map(renderCard).join("")}
        </section>`;

      const searchInput = document.getElementById("search");
      const categorySelect = document.getElementById("category");

      function filterGames() {
        const query = searchInput.value.trim().toLocaleLowerCase("fr");
        const category = categorySelect.value;

        const filtered = games.filter(game =>
          game.name.toLocaleLowerCase("fr").includes(query) &&
          (!category || game.category === category)
        );

        document.getElementById("game-grid").innerHTML = filtered.length
          ? filtered.map(renderCard).join("")
          : `<div class="empty">Aucun jeu ne correspond à votre recherche.</div>`;
      }

      searchInput.addEventListener("input", filterGames);
      categorySelect.addEventListener("change", filterGames);
    }

    function openGame(id) {
      location.hash = `jeu/${id}`;
    }

    function renderDetail(id) {
      const game = games.find(item => item.id === id);

      if (!game) {
        renderCatalogue();
        return;
      }

      app.innerHTML = `
        <article class="detail">
          <div class="detail-top">
            <div>${renderIllustration(game).replace('class="game-art"', 'class="detail-art"')}</div>
            <div class="detail-info">
              <button class="back" onclick="location.hash='catalogue'">
                ← Retour à la ludothèque
              </button>

              <h2>${escapeHtml(game.name)}</h2>
              <p class="detail-description">${escapeHtml(game.description)}</p>

              <div class="detail-meta">
                <span class="tag">${escapeHtml(game.category)}</span>
                <span class="tag">👥 ${escapeHtml(game.players)}</span>
                <span class="tag">🎂 ${escapeHtml(game.age)}</span>
                <span class="tag">⏱️ ${escapeHtml(game.duration)}</span>
              </div>

              <div class="actions">
                <a class="button button-primary"
                  href="${escapeHtml(game.productUrl)}"
                  target="_blank" rel="noopener noreferrer">
                  Voir chez ${escapeHtml(game.retailer)} ↗
                </a>
                <button class="button" onclick="location.hash='catalogue'">
                  Tous les jeux
                </button>
              </div>
            </div>
          </div>

          <section class="section">
            <h3>📖 Comment jouer ?</h3>
            <p>${escapeHtml(game.rules)}</p>
          </section>

          <section class="section">
            <h3>ℹ️ Informations</h3>
            <p>
              <strong>Catégorie :</strong> ${escapeHtml(game.category)}<br>
              <strong>Nombre de joueurs :</strong> ${escapeHtml(game.players)}<br>
              <strong>Âge conseillé :</strong> ${escapeHtml(game.age)}<br>
              <strong>Durée indicative :</strong> ${escapeHtml(game.duration)}<br>
              <strong>Enseigne :</strong> ${escapeHtml(game.retailer)}
            </p>
          </section>
        </article>`;
    }

    function renderApp() {
      const hash = decodeURIComponent(location.hash.slice(1));

      if (hash.startsWith("jeu/")) {
        renderDetail(hash.slice(4));
      } else {
        renderCatalogue();
      }

      window.scrollTo({ top: 0, behavior: "auto" });
    }

    window.openGame = openGame;

    window.addEventListener("hashchange", renderApp);

    if (!location.hash) {
      history.replaceState(null, "", "#catalogue");
    }

    renderApp();
  </script>
</body>
</html>
